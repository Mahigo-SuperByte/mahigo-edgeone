<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mahigo Group — Admin Console</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap');
:root{--navy:#102b61;--blue:#1769d2;--blue2:#368cf0;--sky:#eaf4ff;--ice:#f5f9ff;--ink:#17345f;--muted:#7185a4;--line:#dce8f8;--white:#fff;--cyan:#74d4ff;--shadow:0 12px 34px #174d8b14}
*{box-sizing:border-box}body{margin:0;background:var(--ice);color:var(--ink);font-family:Tahoma,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.brand{font-family:'Lilita One',Impact,sans-serif;letter-spacing:.2px}.display{font-family:'Fredoka',Tahoma,sans-serif}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#8fd8ff 0,transparent 30%),linear-gradient(145deg,#0d3474,#176fd4 55%,#56b5f2)}
.login-card{width:min(430px,100%);padding:36px;background:#fff;border-radius:28px;box-shadow:0 24px 70px #08224b66}.logo{width:58px;height:58px;border-radius:19px;background:linear-gradient(145deg,#0c3c88,#3997f5);display:grid;place-items:center;color:white;font:32px 'Lilita One';box-shadow:0 8px 20px #1769d244}.login h1{font:34px 'Lilita One';margin:18px 0 4px;color:var(--navy)}.sub{color:var(--muted);font-size:13px;line-height:1.6}.field{display:grid;gap:7px;margin:16px 0}.field label{font-size:12px;font-weight:bold;color:#45638d}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fafdff;padding:13px 14px;border-radius:12px;outline:none;color:var(--ink)}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #368cf022}.btn{padding:11px 16px;border-radius:12px;background:var(--blue);color:#fff;font-weight:bold;box-shadow:0 5px 13px #1769d22c}.btn:hover{background:#0f55b6}.btn.secondary{background:#e8f2ff;color:#1459b3;box-shadow:none}.btn.ghost{background:transparent;color:#4c6b94;box-shadow:none}.btn.danger{background:#fff0f0;color:#c13e4c;box-shadow:none}.btn.small{padding:8px 11px;font-size:12px}.login .btn{width:100%;padding:14px}.error{color:#c13e4c;font-size:12px;min-height:18px}
#app{display:none;min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:252px;background:linear-gradient(180deg,#102e68,#124b9c 70%,#1769c8);color:white;padding:22px 16px;display:flex;flex-direction:column;z-index:5}.sidebrand{display:flex;align-items:center;gap:12px;padding:4px 8px 25px}.sidebrand .logo{width:43px;height:43px;border-radius:14px;background:#ffffff20;box-shadow:none}.sidebrand strong{font:23px 'Lilita One';display:block}.sidebrand small{font:10px Tahoma;color:#bcdcff;letter-spacing:1.5px}.navlabel{font-size:10px;color:#8eb8ed;letter-spacing:1.6px;padding:12px 12px 7px}.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:12px;background:transparent;color:#d8eaff;text-align:left;margin:2px 0;font-size:13px}.nav button .ico{width:20px;text-align:center;font-size:16px}.nav button.active,.nav button:hover{background:#ffffff20;color:#fff}.sidebottom{margin-top:auto;border-top:1px solid #ffffff24;padding:16px 8px 2px;font-size:11px;color:#a9cafa;line-height:1.7}
.main{margin-left:252px;min-height:100vh}.topbar{height:76px;background:#ffffffd9;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:4}.crumb{font:22px 'Fredoka';font-weight:600;color:var(--navy)}.adminchip{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:bold}.avatar{width:35px;height:35px;border-radius:50%;background:linear-gradient(145deg,#75cfff,#1769d2);color:white;display:grid;place-items:center;font:17px 'Lilita One'}.content{padding:28px 30px;max-width:1500px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.pagehead h2{font:30px 'Fredoka';margin:0 0 4px;color:var(--navy)}.pagehead p{margin:0;color:var(--muted);font-size:13px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.stat{padding:19px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon{width:35px;height:35px;border-radius:11px;background:var(--sky);display:grid;place-items:center;font-size:17px}.stat strong{display:block;font:30px 'Fredoka';color:var(--navy);margin:12px 0 2px}.stat small{font-size:11px;color:#7a91b0}.cols{grid-template-columns:1.25fr .75fr}.panel{padding:20px;margin-bottom:16px}.panel h3{font:19px 'Fredoka';margin:0 0 15px;color:var(--navy)}.activity{display:grid;gap:14px}.activity-item{display:flex;gap:12px;align-items:center;font-size:12px}.activity-dot{width:9px;height:9px;border-radius:50%;background:#3897ee;box-shadow:0 0 0 4px #e8f4ff}.activity-item small{display:block;color:var(--muted);margin-top:3px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{padding:16px 12px;text-align:left;border:1px solid var(--line);border-radius:14px;background:#fafdff;color:var(--ink)}.quick button:hover{border-color:#8abaf2;background:#f1f8ff}.quick b{display:block;margin-top:8px;font-size:12px}.quick span{font-size:20px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:#8194af;font-size:10px;letter-spacing:.8px;text-transform:uppercase;padding:11px;border-bottom:1px solid var(--line)}td{padding:13px 11px;border-bottom:1px solid #edf2f9}tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:5px 9px;border-radius:30px;background:#e9f4ff;color:#1764bd;font-size:10px;font-weight:bold}.pill.gray{background:#f0f3f8;color:#71819a}.rowactions{display:flex;gap:6px;flex-wrap:wrap}.empty{text-align:center;color:#8294ac;padding:28px 10px;font-size:12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.full{grid-column:1/-1}.hint{font-size:11px;color:var(--muted);line-height:1.6}.notice{background:#eff7ff;border:1px solid #d4e9ff;border-radius:12px;padding:12px 14px;color:#315d91;font-size:11px;line-height:1.6;margin:12px 0}.modalback{position:fixed;inset:0;background:#0a224b77;display:none;place-items:center;padding:20px;z-index:20}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:white;border-radius:20px;padding:24px;box-shadow:0 24px 70px #061a3c66}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h3{font:23px 'Fredoka';margin:0;color:var(--navy)}.close{background:#edf4fc;color:#47658c;border-radius:9px;width:32px;height:32px;font-size:18px}.toast{position:fixed;right:24px;bottom:24px;background:#102e68;color:#fff;padding:13px 18px;border-radius:12px;box-shadow:0 8px 30px #09234b55;z-index:30;font-size:12px;display:none}.dangerzone{border:1px solid #ffd7d7;background:#fffafa}.mobilemenu{display:none}
@media(max-width:950px){.sidebar{width:215px}.main{margin-left:215px}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}
@media(max-width:680px){.sidebar{width:68px;padding:16px 8px}.sidebrand{padding:0 4px 22px}.sidebrand .logo{width:48px;height:48px}.sidebrand div:not(.logo),.navlabel,.nav button span:not(.ico),.sidebottom{display:none}.nav button{justify-content:center;padding:13px 4px}.nav button .ico{font-size:19px}.main{margin-left:68px}.topbar{padding:0 15px}.content{padding:20px 14px}.pagehead{flex-direction:column}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:25px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<section class="login" id="login">
 <div class="login-card">
  <div class="logo">M</div>
  <h1>Mahigo Group</h1>
  <div class="sub">ADMINISTRATION PORTAL · Authorized administrators only</div>
  <form id="loginForm">
   <div class="field"><label>ADMIN USERNAME</label><input id="username" autocomplete="username" placeholder="Admin username" value="admin" required></div>
   <div class="field"><label>ADMIN PASSWORD</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter admin password" required></div>
   <div class="error" id="loginError"></div>
   <button class="btn" type="submit">Enter Admin Console →</button>
  </form>
  <p class="hint" style="margin-top:18px">Private control panel for Mahigo Group services and sub-brands.</p>
 </div>
</section>
<div id="app">
<aside class="sidebar">
 <div class="sidebrand"><div class="logo">M</div><div><strong>Mahigo Group</strong><small>ADMIN CONSOLE</small></div></div>
 <div class="navlabel">WORKSPACE</div>
 <nav class="nav">
  <button class="active" data-page="overview"><span class="ico">▦</span><span>Overview</span></button>
  <button data-page="websites"><span class="ico">◫</span><span>MahigoWebs</span></button>
  <button data-page="games"><span class="ico">▶</span><span>MahigoGames</span></button>
  <button data-page="apis"><span class="ico">⌘</span><span>Mahigo Kusum API</span></button>
  <button data-page="database"><span class="ico">▤</span><span>Database Center</span></button>
 </nav>
 <div class="navlabel">ORGANIZATION</div>
 <nav class="nav">
  <button data-page="brands"><span class="ico">✧</span><span>Sub-brands</span></button>
  <button data-page="settings"><span class="ico">⚙</span><span>Settings</span></button>
 </nav>
 <div class="sidebottom">MAHIGO GROUP<br>Bangladesh · Admin access<br><span style="color:#d5eaff">Blue is our home.</span></div>
</aside>
<main class="main">
 <header class="topbar"><div class="crumb" id="crumb">Overview</div><div class="adminchip"><div class="avatar">A</div><span>Administrator</span><button class="btn ghost small" id="logout">Log out</button></div></header>
 <div class="content" id="content"></div>
</main>
</div>
<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h3 id="modalTitle">Create</h3><button class="close" id="modalClose">×</button></div><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script src="/app.js" defer></script>
</body></html>
